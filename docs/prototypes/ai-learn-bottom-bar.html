<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root {
    --bg-primary: #ffffff; --bg-secondary: #f6f7f9; --bg-hover: #ececf0;
    --border-color: #e2e4e9; --text-primary: #1f2328; --text-muted: #8b949e; --text-secondary: #57606a;
    --accent: #1f2328;
  }
  body { margin: 0; background: #dfe3ea; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .h { font: 600 13px/1 "Segoe UI", sans-serif; color: #1f2328; margin: 0 0 4px; }
  .d { font: 12px/1.6 "Segoe UI", sans-serif; color: #6b7280; margin: 0 0 8px; }
  .panel { background: var(--bg-primary); border: 1px solid #c9cdd6; border-radius: 8px; overflow: hidden; }
  .body-ghost { height: 74px; display: flex; align-items: center; justify-content: center; color: #b4b2a9; font-size: 12px; }
  .sep { height: 1px; background: var(--border-color); }
</style>
</head>
<body>
<div style="padding:26px 36px 50px">

  <!-- ===== 方案 A ===== -->
  <div style="width:820px;margin-bottom:30px">
    <p class="h">方案 A · 单排（动作靠左，导航靠右）</p>
    <p class="d">一排解决，不再分两行。上一步/下一步同款描边、相邻成对。</p>
    <div class="panel">
      <div class="body-ghost">讲义正文区</div>
      <div class="sep"></div>
      <div class="flex flex-wrap items-center gap-1.5 px-6 py-3">
        <button class="flex h-8 items-center rounded-lg bg-[var(--accent)] px-3.5 text-[12px] text-white">在编辑器中打开该文件</button>
        <button class="flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] text-[var(--text-muted)]">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>
          问 AI 这一步
        </button>
        <span class="flex-1"></span>
        <button class="flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] text-emerald-500">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          标记为已完成
        </button>
        <button class="flex h-8 items-center gap-1 rounded-lg border border-[var(--border-color)] px-3 text-[12px] text-[var(--text-secondary)]">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
          上一步
        </button>
        <button class="flex h-8 items-center gap-1 rounded-lg border border-[var(--border-color)] px-3 text-[12px] text-[var(--text-secondary)]">
          下一步
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== 方案 B ===== -->
  <div style="width:820px;margin-bottom:30px">
    <p class="h">方案 B · 两排 + 分隔（动作在上，导航在下，两端对称）</p>
    <p class="d">保留两排的分工，但加一条极淡分隔线把两组隔开；上一步/下一步同款描边、各守一端。</p>
    <div class="panel">
      <div class="body-ghost">讲义正文区</div>
      <div class="sep"></div>
      <div class="px-6 py-2.5">
        <div class="flex flex-wrap items-center gap-1.5">
          <button class="flex h-8 items-center rounded-lg bg-[var(--accent)] px-3.5 text-[12px] text-white">在编辑器中打开该文件</button>
          <button class="flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] text-[var(--text-muted)]">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>
            问 AI 这一步
          </button>
        </div>
        <div class="sep" style="margin:8px 0"></div>
        <div class="flex items-center gap-1.5">
          <button class="flex h-8 items-center gap-1 rounded-lg border border-[var(--border-color)] px-3 text-[12px] text-[var(--text-secondary)]">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
            上一步
          </button>
          <span class="flex-1"></span>
          <button class="flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] text-emerald-500">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            标记为已完成
          </button>
          <button class="flex h-8 items-center gap-1 rounded-lg border border-[var(--border-color)] px-3 text-[12px] text-[var(--text-secondary)]">
            下一步
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 方案 C ===== -->
  <div style="width:820px;margin-bottom:30px">
    <p class="h">方案 C · 两排 + 动作行居中</p>
    <p class="d">结构同 B，但动作行居中摆放，消除「左边一块、右边空荡」的不平衡感。</p>
    <div class="panel">
      <div class="body-ghost">讲义正文区</div>
      <div class="sep"></div>
      <div class="px-6 py-2.5">
        <div class="flex flex-wrap items-center justify-center gap-1.5">
          <button class="flex h-8 items-center rounded-lg bg-[var(--accent)] px-3.5 text-[12px] text-white">在编辑器中打开该文件</button>
          <button class="flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] text-[var(--text-muted)]">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>
            问 AI 这一步
          </button>
        </div>
        <div class="sep" style="margin:8px 0"></div>
        <div class="flex items-center gap-1.5">
          <button class="flex h-8 items-center gap-1 rounded-lg border border-[var(--border-color)] px-3 text-[12px] text-[var(--text-secondary)]">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
            上一步
          </button>
          <span class="flex-1"></span>
          <button class="flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] text-emerald-500">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            标记为已完成
          </button>
          <button class="flex h-8 items-center gap-1 rounded-lg border border-[var(--border-color)] px-3 text-[12px] text-[var(--text-secondary)]">
            下一步
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 方案 D ===== -->
  <div style="width:820px">
    <p class="h">方案 D · 单排 + 收纳「标记完成」（最简）</p>
    <p class="d">去掉独立的「标记为已完成」，改为点「下一步」时自动标记（hover 出提示）。底栏只剩 4 个元素。</p>
    <div class="panel">
      <div class="body-ghost">讲义正文区</div>
      <div class="sep"></div>
      <div class="flex flex-wrap items-center gap-1.5 px-6 py-3">
        <button class="flex h-8 items-center rounded-lg bg-[var(--accent)] px-3.5 text-[12px] text-white">在编辑器中打开该文件</button>
        <button class="flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] text-[var(--text-muted)]">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>
          问 AI 这一步
        </button>
        <span class="flex-1"></span>
        <button class="flex h-8 items-center gap-1 rounded-lg border border-[var(--border-color)] px-3 text-[12px] text-[var(--text-secondary)]">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
          上一步
        </button>
        <button class="flex h-8 items-center gap-1 rounded-lg border border-[var(--border-color)] px-3 text-[12px] text-[var(--text-secondary)]">
          下一步
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>习惯打卡</title>
<style>
  :root { --bg:#fafafa; --card:#fff; --line:#e5e5e5; --text:#333; --sub:#888; --accent:#378add; --danger:#d33; --ok:#1d9e75; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:22px 18px 70px; }
  h1 { font-size:17px; font-weight:600; margin:0 0 2px; }
  .sub { font-size:12px; color:var(--sub); margin-bottom:14px; }
  .toolbar { display:flex; gap:8px; margin-bottom:14px; align-items:center; }
  input { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; background:var(--card); color:var(--text); outline:none; }
  button { border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; }
  .ghost { background:transparent; border:1px solid var(--line); color:var(--sub); }
  .err { color:var(--danger); font-size:12px; min-height:16px; margin:4px 0 8px; }
  .hcard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .hrow { display:flex; align-items:center; gap:12px; }
  .hdot { width:12px; height:40px; border-radius:6px; flex-shrink:0; }
  .hname { flex:1; min-width:0; }
  .hname .n { font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hname .m { font-size:11.5px; color:var(--sub); margin-top:2px; }
  .bigbtn { width:46px; height:46px; border-radius:50%; border:2px solid var(--line); background:transparent; font-size:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; }
  .bigbtn.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  .hstat { text-align:right; flex-shrink:0; font-size:12px; color:var(--sub); line-height:1.5; }
  .week { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:12px; }
  .wd { text-align:center; font-size:10.5px; color:var(--sub); padding:1px 0; }
  .wdot { height:30px; border-radius:8px; border:1px dashed var(--line); background:transparent; cursor:pointer; font-size:10px; color:var(--sub); display:flex; align-items:center; justify-content:center; }
  .wdot.on { border-style:solid; background:var(--ok); border-color:var(--ok); color:#fff; }
  .wdot.today { outline:2px solid var(--accent); outline-offset:1px; }
  .empty { text-align:center; color:var(--sub); font-size:13px; padding:46px 0; }
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:10; }
  .modal { width:380px; max-width:92vw; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .f { display:flex; flex-direction:column; gap:8px; }
  .f label { font-size:12px; color:var(--sub); }
  .pal { display:flex; gap:6px; }
  .pal button { width:22px; height:22px; border-radius:50%; border:2px solid transparent; }
  .pal button.on { border-color:var(--text); }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>习惯打卡</h1>
  <div class="sub">数据存 kb.store · 点大圆钮打卡今天 · 点历史格子可补签/撤销</div>
  <div class="toolbar">
    <button class="primary" id="btnAdd">+ 添加习惯</button>
  </div>
  <div class="err" id="errBox"></div>
  <div id="list"></div>
  <div class="empty" id="emptyBox" style="display:none">还没有习惯 — 点「添加习惯」开始</div>
</div>

<div class="modal-back" id="modal" style="display:none">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="mTitle">添加习惯</h3>
    <div class="f">
      <label>名称（如：晨跑 3 公里）</label><input id="fName" maxlength="30" placeholder="习惯名称">
      <label>每周目标（0 = 每天都要做）</label>
      <select id="fTarget">
        <option value="0">每天</option><option value="1">≥1 天/周</option><option value="2">≥2 天/周</option>
        <option value="3">≥3 天/周</option><option value="4">≥4 天/周</option><option value="5">≥5 天/周</option>
        <option value="6">≥6 天/周</option><option value="7">7 天/周</option>
      </select>
      <label>颜色</label>
      <div class="pal" id="fPal"></div>
      <div class="err" id="mErr"></div>
    </div>
    <div class="btns">
      <button class="ghost" id="mCancel">取消</button>
      <button class="primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<script>
var CHANNEL='kb-plugin', seq=0, pend={}
var data={ habits:[], records:{} }   // records: { habitId: ['2026-09-03', ...] }
var editingId=null
var KEY='habits.json'
var PALETTE=['#378add','#1d9e75','#d85a30','#d4537e','#854F0B','#639922','#534AB7']

function rpc(method,params){ return new Promise(function(resolve){ var id='h'+(++seq); pend[id]=resolve; parent.postMessage({channel:CHANNEL,v:2,id:id,method:method,params:params},'*') }) }
window.addEventListener('message',function(e){ var d=(e.data||{})
  if(d.channel!==CHANNEL) return
  if(d.v===2&&d.action==='init'){ applyTheme((d.payload&&d.payload.vars)||{}); load(); return }
  if(d.v===2&&d.id&&pend[d.id]){ var p=pend[d.id]; delete pend[d.id]; d.ok?p({ok:true,result:d.result}):p({ok:false,error:d.error||{}}) } })
async function g(key){ var r=await rpc('kb.store.get',{key:key}); return r.ok&&r.result?r.result.value:null }
async function put(key,val){ var r=await rpc('kb.store.set',{key:key,value:val}); if(!r.ok) throw new Error((r.error&&r.error.message)||'保存失败') }

function applyTheme(vars){ var map={bg:'--bg-primary',card:'--bg-secondary',line:'--border-color',text:'--text-primary',sub:'--text-secondary',accent:'--accent',danger:'--danger'}; var st=document.documentElement.style; for(var k in map){ var v=vars[map[k]]; if(v) st.setProperty('--'+k,v) } }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}) }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function addDays(s,n){ var d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function last7(){ var t=todayStr(), out=[]; for(var i=6;i>=0;i--) out.push(addDays(t,-i)); return out }
function weekStart(s){ var d=new Date(s+'T12:00:00'); var dow=(d.getDay()+6)%7; return addDays(s,-dow) }
function setErr(m){ document.getElementById('errBox').textContent=m||'' }

async function load(){
  try{ var d=await g(KEY); if(d&&Array.isArray(d.habits)&&d.records&&typeof d.records==='object') data=d }
  catch(e){ setErr(String(e)) }
  render()
}
async function persist(){ try{ await put(KEY,data) }catch(e){ setErr(String(e)); return false } return true }

function has(habitId,date){ var rs=data.records[habitId]; return !!rs&&rs.indexOf(date)>=0 }
function streak(habitId){
  var t=todayStr(), n=0
  // 若今天没打卡，从昨天开始算连续（显示截至昨天的连续）
  var cur=has(habitId,t)?t:addDays(t,-1)
  while(has(habitId,cur)){ n++; cur=addDays(cur,-1) }
  return n
}
function weekDone(habitId){
  var ws=weekStart(todayStr()), n=0
  for(var i=0;i<7;i++) if(has(habitId,addDays(ws,i))) n++
  return n
}

function render(){
  var box=document.getElementById('list')
  var empty=document.getElementById('emptyBox')
  box.innerHTML=''
  empty.style.display=data.habits.length===0?'block':'none'
  var days=last7(), labels=['日','一','二','三','四','五','六']
  data.habits.forEach(function(h){
    var goal=h.weeklyTarget||0
    var done=weekDone(h.id)
    var okToday=has(h.id,todayStr())
    var st=streak(h.id)
    var d=document.createElement('div'); d.className='hcard'
    // 头行
    var hr=document.createElement('div'); hr.className='hrow'
    var dot=document.createElement('div'); dot.className='hdot'; dot.style.background=h.color||'var(--accent)'
    var nm=document.createElement('div'); nm.className='hname'
    var n=document.createElement('div'); n.className='n'; n.textContent=h.name
    var mm=document.createElement('div'); mm.className='m'; mm.textContent=(goal===0?'每天':('每周≥'+goal+' 天'))+' · 本周 '+done+'/'+(goal===0?7:goal)+' · 连续 '+st+' 天'
    nm.appendChild(n); nm.appendChild(mm)
    var big=document.createElement('button'); big.className='bigbtn'+(okToday?' on':'')
    big.innerHTML=okToday?'✓':''
    big.title=okToday?'今日已打卡，点击撤销':'点击打卡今天'
    big.onclick=function(){ void toggle(h.id,todayStr()) }
    var ops=document.createElement('div'); ops.style.cssText='display:flex;flex-direction:column;gap:3px;flex-shrink:0'
    var bE=document.createElement('button'); bE.className='ghost'; bE.style.padding='2px 10px'; bE.style.fontSize='11px'; bE.textContent='编辑'; bE.onclick=function(){ openEdit(h) }
    var bD=document.createElement('button'); bD.className='ghost'; bD.style.padding='2px 10px'; bD.style.fontSize='11px'; bD.style.color='var(--danger)'; bD.textContent='删除'; bD.onclick=function(){ if(confirm('删除习惯「'+h.name+'」及其全部打卡记录？')) delHabit(h.id) }
    ops.appendChild(bE); ops.appendChild(bD)
    hr.appendChild(dot); hr.appendChild(nm); hr.appendChild(big); hr.appendChild(ops)
    d.appendChild(hr)
    // 周格
    var wk=document.createElement('div'); wk.className='week'
    days.forEach(function(ds,idx){
      var c=document.createElement('div')
      var lb=document.createElement('div'); lb.className='wd'; lb.textContent=labels[idx]
      var b=document.createElement('button'); b.className='wdot'+(has(h.id,ds)?' on':'')+(ds===todayStr()?' today':'')
      b.textContent=has(h.id,ds)?'✓':String(parseInt(ds.slice(8),10))
      b.title=ds+(has(h.id,ds)?'（已打卡）':'（补签）')
      b.onclick=function(){ void toggle(h.id,ds) }
      c.appendChild(lb); c.appendChild(b)
      wk.appendChild(c)
    })
    d.appendChild(wk)
    box.appendChild(d)
  })
}

async function toggle(habitId,date){
  var rs=data.records[habitId]||(data.records[habitId]=[])
  var i=rs.indexOf(date)
  if(i>=0) rs.splice(i,1); else rs.push(date)
  rs.sort()
  if(!(await persist())) return
  render()
}
async function delHabit(id){
  data.habits=data.habits.filter(function(h){return h.id!==id})
  delete data.records[id]
  if(!(await persist())) return
  render()
}

/* 弹层 */
function openEdit(h){
  editingId=h?h.id:null
  document.getElementById('mTitle').textContent=h?'编辑习惯':'添加习惯'
  document.getElementById('fName').value=h?h.name:''
  document.getElementById('fTarget').value=String(h?(h.weeklyTarget||0):0)
  document.getElementById('mErr').textContent=''
  // 调色板
  var pal=document.getElementById('fPal')
  pal.innerHTML=''
  var cur=h?(h.color||PALETTE[0]):PALETTE[0]
  PALETTE.forEach(function(c){
    var b=document.createElement('button'); b.style.background=c; b.className=c===cur?'on':''
    b.onclick=function(){ pal.querySelectorAll('button').forEach(function(x){x.className=''}); b.className='on'; pal._cur=c }
    pal.appendChild(b)
  })
  pal._cur=cur
  document.getElementById('modal').style.display='flex'
}
function closeModal(){ document.getElementById('modal').style.display='none'; editingId=null }

function save(){
  var name=document.getElementById('fName').value.trim()
  var target=parseInt(document.getElementById('fTarget').value,10)||0
  var pal=document.getElementById('fPal')
  var color=pal._cur||PALETTE[0]
  var err=document.getElementById('mErr')
  if(!name){ err.textContent='请填写习惯名称'; return }
  err.textContent=''
  if(editingId){
    var h=data.habits.find(function(x){return x.id===editingId})
    if(h){ h.name=name; h.weeklyTarget=target; h.color=color }
  } else {
    data.habits.push({ id:'hb'+Date.now(), name:name, weeklyTarget:target, color:color, createdAt:new Date().toISOString() })
  }
  persist().then(function(){ closeModal(); render() })
}

document.getElementById('btnAdd').onclick=function(){ openEdit(null) }
document.getElementById('mSave').onclick=save
document.getElementById('mCancel').onclick=closeModal
document.querySelector('.modal-back').onclick=closeModal
document.getElementById('fName').addEventListener('keydown',function(e){ if(e.key==='Enter') save() })
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网址导航</title>
<style>
  :root { --bg:#fafafa; --card:#fff; --line:#e5e5e5; --text:#333; --sub:#888; --accent:#378add; --danger:#d33; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:860px; margin:0 auto; padding:22px 18px 70px; }
  h1 { font-size:17px; font-weight:600; margin:0 0 2px; }
  .sub { font-size:12px; color:var(--sub); margin-bottom:14px; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  input, select { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; background:var(--card); color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  button { border:none; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; }
  .ghost { background:transparent; border:1px solid var(--line); color:var(--sub); }
  .ghost:hover { color:var(--text); border-color:var(--sub); }
  .cats { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .cat { padding:5px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:12.5px; color:var(--sub); cursor:pointer; }
  .cat.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
  .site { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; transition:border-color .15s, transform .15s; }
  .site:hover { border-color:var(--accent); transform:translateY(-1px); }
  .site .fc { width:36px; height:36px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; background:#E6F1FB; color:var(--accent); font-weight:600; }
  .site .m { min-width:0; flex:1; }
  .site .t { font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .site .u { font-size:11px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .site .ops { opacity:0; transition:opacity .12s; display:flex; gap:4px; }
  .site:hover .ops { opacity:1; }
  .site .ops button { padding:2px 7px; font-size:11px; }
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:10; }
  .modal { width:420px; max-width:92vw; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .f { display:flex; flex-direction:column; gap:8px; }
  .f label { font-size:12px; color:var(--sub); }
  .modal .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .empty { text-align:center; color:var(--sub); font-size:13px; padding:50px 0; }
  .err { color:var(--danger); font-size:12px; min-height:16px; margin-top:8px; }
  .badge { font-size:10px; color:var(--sub); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>网址导航</h1>
  <div class="sub">数据存 kb.store · 点击条目经宿主默认浏览器打开（navigation 授权）</div>

  <div class="toolbar">
    <input id="q" placeholder="搜索名称 / 网址…" style="flex:1;min-width:160px">
    <button class="primary" id="btnAddSite">添加网址</button>
    <button class="ghost" id="btnAddCat">+ 分类</button>
  </div>

  <div class="cats" id="cats"></div>
  <div class="err" id="errBox"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyBox" style="display:none">还没有网址 — 点「添加网址」开始</div>
</div>

<script>
var CHANNEL='kb-plugin', seq=0, pend={}
var state = { categories:[], items:[] }
var curCat = 'all'
var KEY = 'site-nav.json'

function rpc(method, params){
  return new Promise(function(resolve){
    var id='s'+(++seq); pend[id]=resolve
    parent.postMessage({channel:CHANNEL,v:2,id:id,method:method,params:params},'*')
  })
}
window.addEventListener('message', function(e){
  var d=(e.data||{})
  if(d.channel!==CHANNEL) return
  if(d.v===2 && d.action==='init'){
    applyTheme((d.payload&&d.payload.vars)||{})
    load(); return
  }
  if(d.v===2 && d.id && pend[d.id]){ var p=pend[d.id]; delete pend[d.id]
    d.ok?p({ok:true,result:d.result}):p({ok:false,error:d.error||{}}) }
})
async function g(key){ var r=await rpc('kb.store.get',{key:key}); return r.ok&&r.result?r.result.value:null }
async function s(key,val){ var r=await rpc('kb.store.set',{key:key,value:val}); if(!r.ok) throw new Error((r.error&&r.error.message)||'保存失败') }

function applyTheme(vars){
  var map={bg:'--bg-primary',card:'--bg-secondary',line:'--border-color',text:'--text-primary',sub:'--text-secondary',accent:'--accent',danger:'--danger'}
  var st=document.documentElement.style
  for(var k in map){ var v=vars[map[k]]; if(v) st.setProperty('--'+k, v) }
}
function setErr(m){ document.getElementById('errBox').textContent=m||'' }
function hostname(u){ try{ return new URL(u).hostname }catch(e){ return '' } }
function letter(n){ var c=(n||'?').trim().charAt(0).toUpperCase(); return /[A-Z0-9\u4e00-\u9fa5]/.test(c)?c:'?' }

async function load(){
  try{ var d=await g(KEY); if(d&&Array.isArray(d.categories)&&Array.isArray(d.items)) state=d }
  catch(e){ setErr(String(e)) }
  render()
}
async function persist(){ try{ await s(KEY,state) }catch(e){ setErr(String(e)); return false } return true }
function now(){ return new Date().toISOString() }

function catName(id){ var c=state.categories.find(function(x){return x.id===id}); return c?c.name:'未分类' }

function render(){
  var catsEl=document.getElementById('cats')
  var html='<button class="cat'+(curCat==='all'?' on':'')+'" data-c="all">全部 ('+state.items.length+')</button>'
  state.categories.forEach(function(c){
    var n=state.items.filter(function(i){return i.categoryId===c.id}).length
    html+='<button class="cat'+(curCat===c.id?' on':'')+'" data-c="'+c.id+'">'+esc(c.name)+' ('+n+')</button>'
  })
  catsEl.innerHTML=html
  Array.prototype.forEach.call(catsEl.querySelectorAll('.cat'),function(b){
    b.onclick=function(){ curCat=b.getAttribute('data-c'); render() }
  })
  var q=(document.getElementById('q').value||'').trim().toLowerCase()
  var list=state.items.filter(function(i){
    if(curCat!=='all'&&i.categoryId!==curCat) return false
    if(!q) return true
    return (i.name||'').toLowerCase().indexOf(q)>=0 || (i.url||'').toLowerCase().indexOf(q)>=0
  })
  var grid=document.getElementById('grid')
  var empty=document.getElementById('emptyBox')
  grid.innerHTML=''
  if(list.length===0){ empty.style.display='block'; empty.textContent=state.items.length===0?'还没有网址 — 点「添加网址」开始':'没有匹配的网址'; return }
  empty.style.display='none'
  list.forEach(function(it){
    var d=document.createElement('div'); d.className='site'; d.title=it.url
    var f=document.createElement('div'); f.className='fc'; f.textContent=letter(it.name)
    var m=document.createElement('div'); m.className='m'
    var t=document.createElement('div'); t.className='t'; t.textContent=it.name
    var u=document.createElement('div'); u.className='u'; u.textContent=catName(it.categoryId)+' · '+(hostname(it.url)||it.url)
    var ops=document.createElement('div'); ops.className='ops'
    var bE=document.createElement('button'); bE.textContent='改'; bE.onclick=function(ev){ ev.stopPropagation(); openEdit(it) }
    var bD=document.createElement('button'); bD.textContent='删'; bD.className='ghost'; bD.style.color='var(--danger)'
    bD.onclick=function(ev){ ev.stopPropagation(); if(confirm('删除网址「'+it.name+'」？')) doDel(it.id) }
    ops.appendChild(bE); ops.appendChild(bD)
    m.appendChild(t); m.appendChild(u)
    d.appendChild(f); d.appendChild(m); d.appendChild(ops)
    d.onclick=function(){ openSite(it) }
    grid.appendChild(d)
  })
}

async function openSite(it){
  var r=await rpc('kb.ui.openExternal',{url:it.url})
  if(!r.ok){ setErr((r.error&&r.error.message)||'打开失败'); return }
  setErr('')
}
async function doDel(id){
  state.items=state.items.filter(function(x){return x.id!==id})
  if(!(await persist())) return
  render()
}

/* ---- 网址编辑弹层 ---- */
var editing=null
function openEdit(it){
  editing=it||null
  document.getElementById('mTitle').textContent=it?'编辑网址':'添加网址'
  document.getElementById('fName').value=it?it.name:''
  document.getElementById('fUrl').value=it?it.url:''
  // 分类下拉同步
  var sel=document.getElementById('fCat')
  sel.innerHTML='<option value="">未分类</option>'
  state.categories.forEach(function(c){
    var o=document.createElement('option'); o.value=c.id; o.textContent=c.name; sel.appendChild(o)
  })
  sel.value=it?it.categoryId:''
  document.getElementById('modal').style.display='flex'
}
function closeModal(){ document.getElementById('modal').style.display='none'; editing=null }
function saveSite(){
  var name=document.getElementById('fName').value.trim()
  var url=document.getElementById('fUrl').value.trim()
  var cat=document.getElementById('fCat').value
  var err=document.getElementById('mErr')
  if(!name){ err.textContent='请填写名称'; return }
  if(!/^https?:\/\/[^\s]+$/i.test(url)){ err.textContent='网址需以 http(s):// 开头'; return }
  err.textContent=''
  if(editing){ editing.name=name; editing.url=url; editing.categoryId=cat; editing.updated=now() }
  else state.items.unshift({ id:'it'+Date.now()+Math.floor(Math.random()*999), name:name, url:url, categoryId:cat, created:now(), updated:now() })
  persist().then(function(){ closeModal(); render() })
}

/* ---- 分类编辑弹层 ---- */
function addCat(){
  var name=prompt('新分类名称')
  if(!name||!name.trim()) return
  state.categories.push({ id:'cat'+Date.now(), name:name.trim() })
  persist().then(function(){ render() })
}

/* 初始化 UI 绑定 */
document.getElementById('btnAddSite').onclick=function(){ openEdit(null) }
document.getElementById('btnAddCat').onclick=addCat
document.getElementById('q').addEventListener('input',render)
document.getElementById('mSave').onclick=saveSite
document.getElementById('mCancel').onclick=closeModal
document.querySelector('.modal-back').onclick=closeModal

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}) }
</script>

<!-- 网址编辑弹层 -->
<div class="modal-back" id="modal" style="display:none">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="mTitle">添加网址</h3>
    <div class="f">
      <label>名称</label><input id="fName" placeholder="如：GitHub">
      <label>网址</label><input id="fUrl" placeholder="https://…">
      <label>分类</label>
      <select id="fCat"></select>
      <div class="err" id="mErr"></div>
    </div>
    <div class="btns">
      <button class="ghost" id="mCancel">取消</button>
      <button class="primary" id="mSave">保存</button>
    </div>
  </div>
</div>
</body>
</html>
